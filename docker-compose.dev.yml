services:
  postgres:
    image: postgres:16-alpine
    container_name: bakery-pos-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos_dev}
      POSTGRES_USER: ${POSTGRES_USER:-pos_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos_dev_change_me}
      TZ: Asia/Jakarta
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pos_postgres_dev_data:/var/lib/postgresql/data
      - ./database/migrations:/migrations:ro
      - ./database/tests:/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos_dev} -d ${POSTGRES_DB:-pos_dev}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pos-dev

volumes:
  pos_postgres_dev_data:

networks:
  pos-dev:
    name: bakery-pos-dev
